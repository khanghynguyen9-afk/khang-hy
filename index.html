<title>Chang Kang Kung CKK — Xuất Nhập Tồn</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ============ DESIGN.md (apple) — token hoá ============ */
  :root{
    --blue:#0066cc;          /* Action Blue — màu tương tác duy nhất */
    --blue-focus:#0071e3;
    --blue-on-dark:#2997ff;
    --ink:#1d1d1f;
    --ink-80:#333333;
    --ink-48:#7a7a7a;
    --muted:#6e6e73;
    --hairline:#e0e0e0;
    --divider:#f0f0f0;
    --canvas:#ffffff;
    --parchment:#f5f5f7;
    --pearl:#fafafc;
    --tile-dark:#272729;
    --tile-dark-2:#2a2a2c;
    --on-dark:#ffffff;
    --on-dark-muted:#cccccc;
    --pos:#1d9d50;           /* xanh lá chênh lệch dương (nền sáng) */
    --neg:#e30000;           /* đỏ chênh lệch âm (nền sáng) */
    --pos-dark:#30d158;      /* trên tile tối */
    --neg-dark:#ff453a;
    --red-logo:#d42a20;      /* màu logo cá — chỉ dùng cho logo/brand */
    --font-display:"SF Pro Display",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-text:"SF Pro Text",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --shadow-product:rgba(0,0,0,.22) 3px 5px 30px 0;  /* bóng duy nhất của hệ — chỉ cho "sản phẩm" */
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:#e2e2e8;color:var(--ink);
    font-family:var(--font-text);font-size:17px;line-height:1.47;letter-spacing:-.022em;
    min-height:100vh;overflow-x:hidden;
  }
  ::selection{background:rgba(0,102,204,.18)}
  button{font-family:var(--font-text)}
  button:active{transform:scale(.95)}          /* micro-interaction toàn hệ */
  button:focus-visible{outline:2px solid var(--blue-focus);outline-offset:2px}

  /* ---------- chữ ký tác giả — cố định góc trên phải ---------- */
  .credit{
    position:fixed;top:16px;right:16px;z-index:60;
    padding:7px 14px;border-radius:9999px;
    border:1px solid rgba(255,255,255,.85);
    background:rgba(255,255,255,.5);
    backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 6px rgba(0,0,0,.08);
    font-size:12px;font-weight:600;letter-spacing:-.12px;color:var(--red-logo);
    white-space:nowrap;pointer-events:none;
  }

  /* ---------- nút 3 gạch cố định (dark utility) ---------- */
  .burger{
    position:fixed;top:16px;left:16px;z-index:60;
    width:44px;height:44px;border-radius:8px;border:none;
    background:var(--ink);
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
    cursor:pointer;transition:opacity .2s;
  }
  .burger span{display:block;width:18px;height:1.5px;background:#fff;border-radius:2px;transition:transform .3s,opacity .3s}
  .burger:hover{opacity:.85}
  .burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
  .burger.open span:nth-child(2){opacity:0}
  .burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

  /* menu: kính mờ parchment kiểu sub-nav Apple */
  .menu{
    position:fixed;top:70px;left:16px;z-index:59;width:min(340px,calc(100vw - 32px));
    border-radius:18px;border:1px solid var(--hairline);
    background:rgba(245,245,247,.8);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    padding:16px;display:flex;flex-direction:column;gap:10px;
    transform-origin:top left;transform:scale(.9) translateY(-8px);opacity:0;pointer-events:none;
    transition:transform .24s cubic-bezier(.3,.8,.3,1),opacity .2s;
  }
  .menu.open{transform:none;opacity:1;pointer-events:auto}
  .menu h4{margin:4px 6px 0;font-size:12px;letter-spacing:-.12px;color:var(--ink-48);font-weight:600;text-transform:uppercase}
  .menu input[type=search]{
    width:100%;height:44px;padding:12px 20px;border-radius:9999px;border:1px solid rgba(0,0,0,.08);
    background:var(--canvas);color:var(--ink);font:inherit;font-size:17px;
  }
  .menu input[type=search]:focus{outline:none;border-color:var(--blue-focus);box-shadow:0 0 0 2px rgba(0,113,227,.25)}
  .menu-item{
    display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:11px;
    border:1px solid var(--divider);background:var(--pearl);color:var(--ink-80);
    font:inherit;font-size:14px;letter-spacing:-.224px;cursor:pointer;text-align:left;
    transition:background .2s,border-color .2s;
  }
  .menu-item:hover{background:#fff;border-color:var(--hairline)}
  .menu-item .ic{width:20px;text-align:center;color:var(--blue)}

  /* ---------- lớp tìm kiếm: kính trắng đè lên trên ---------- */
  .search-layer{
    position:fixed;inset:0;z-index:55;display:none;align-items:flex-start;justify-content:center;
    padding:110px 20px 40px;background:rgba(0,0,0,.32);
  }
  .search-layer.show{display:flex}
  .search-results{width:min(560px,100%);max-height:70vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .glass-card{
    border-radius:18px;border:1px solid var(--hairline);
    background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;
    cursor:pointer;transition:background .2s;
  }
  .glass-card:hover{background:#fff}
  .glass-card:active{transform:scale(.98)}
  .glass-card .nm{font-weight:600;font-size:17px;letter-spacing:-.374px}
  .glass-card .st{font-size:14px;color:var(--muted);letter-spacing:-.224px}
  .glass-card .go{font-size:14px;color:var(--blue);white-space:nowrap}
  .search-empty{color:var(--muted);text-align:center;padding:20px 0;font-size:14px;width:100%}

  /* ---------- hero: tile trắng, logo = "sản phẩm" ---------- */
  .hero{
    position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:84px 22px 72px;text-align:center;
    background:
      radial-gradient(720px 400px at 50% -10%, rgba(212,42,32,.10), transparent 65%),
      radial-gradient(560px 320px at 12% 80%, rgba(0,102,204,.09), transparent 60%),
      radial-gradient(560px 320px at 88% 80%, rgba(212,42,32,.06), transparent 60%),
      #e6e6ec;
  }
  .logo-stage{perspective:900px;width:280px;height:150px;margin-bottom:10px}
  .logo3d{
    width:100%;height:100%;position:relative;transform-style:preserve-3d;
    animation:swim 8s ease-in-out infinite;
  }
  @keyframes swim{
    0%,100%{transform:rotateY(-16deg) rotateX(5deg) translateY(0)}
    50%{transform:rotateY(16deg) rotateX(5deg) translateY(-6px)}
  }
  .logo3d svg{position:absolute;inset:0;width:100%;height:100%}
  .logo3d .l-back{transform:translateZ(-12px);filter:brightness(.5) blur(1px);opacity:.9}
  .logo3d .l-mid{transform:translateZ(-6px);filter:brightness(.72)}
  .logo3d .l-front{transform:translateZ(0);filter:drop-shadow(var(--shadow-product))}
  .brand{
    font-family:var(--font-display);
    font-size:clamp(34px,6vw,56px);font-weight:600;line-height:1.07;letter-spacing:-.015em;
    margin:0;color:var(--ink);
  }
  .brand em{font-style:normal;color:var(--red-logo)}
  .brand-edit{
    border:1px solid var(--hairline);background:rgba(255,255,255,.6);color:var(--ink-48);
    width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;
    vertical-align:middle;margin-left:10px;
  }
  .brand-edit:hover{color:var(--blue);border-color:var(--blue-focus)}
  .brand small{
    display:block;font-family:var(--font-text);font-size:12px;font-weight:600;
    letter-spacing:.32em;color:var(--ink-48);margin-top:12px;
  }
  /* Tổng thành tiền — nổi bật giữa hero, ngay dưới logo cá */
  .hero-total{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    margin:4px 0 14px;padding:14px 34px;border-radius:18px;
    border:1px solid rgba(255,255,255,.85);
    background:rgba(255,255,255,.45);
    backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 6px rgba(0,0,0,.08);
  }
  .hero-total .lb{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--ink-48);text-transform:uppercase}
  .hero-total .amt{
    font-family:var(--font-display);font-size:clamp(28px,4.5vw,40px);font-weight:600;
    letter-spacing:-.022em;font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .hero-total .amt.pos{color:var(--pos)}
  .hero-total .amt.neg{color:var(--neg)}

  /* ---------- hiệu ứng cuộn: mờ dần + thu nhẹ kiểu Apple ---------- */
  .fx{transition:transform .6s cubic-bezier(.25,.7,.3,1),opacity .6s;will-change:transform,opacity}
  .fx.dim{transform:scale(.98) translateY(14px);opacity:.3}

  /* ---------- tile xen kẽ: đổi màu nền chính là vạch ngăn ---------- */
  main{position:relative;z-index:1;width:100%;margin:0;padding:0;display:block}
  main section{margin:0;padding:72px 22px}
  main section>*{max-width:1060px;margin-left:auto;margin-right:auto}
  .tile-parchment{background:var(--parchment)}
  .tile-white{background:var(--canvas)}
  .tile-dark{background:var(--tile-dark);color:var(--on-dark)}

  .sec-label{
    font-family:var(--font-display);
    font-size:clamp(24px,3.4vw,34px);font-weight:600;line-height:1.15;letter-spacing:-.022em;
    color:inherit;display:block;margin:0 auto 8px;text-transform:none;
  }
  .sec-label::after{content:none}
  .sec-label{margin-bottom:28px}
  .cat-label{
    font-size:14px;font-weight:600;letter-spacing:-.224px;color:var(--ink-48);
    margin:28px auto 12px;text-transform:uppercase;
  }
  .cat-label:first-child{margin-top:0}

  /* ---------- ô tên vật tư / món bán: chip pill trắng hairline ---------- */
  .pill-grid{display:flex;flex-wrap:wrap;gap:12px}
  .item{position:relative}
  .pill{
    display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:9999px;
    border:1px solid rgba(255,255,255,.85);cursor:pointer;user-select:none;
    background:rgba(255,255,255,.42);color:var(--ink);
    backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 6px rgba(0,0,0,.08);
    font:inherit;font-size:14px;font-weight:400;letter-spacing:-.224px;
    white-space:normal;text-align:left;max-width:100%;
    transition:border-color .2s,transform .2s,background .2s;
  }
  .item:hover .pill{border-color:#b8b8bd;background:rgba(255,255,255,.7)}
  /* nền tối hơn một tông + ánh màu để chip kính nổi rõ */
  .tile-parchment{
    background:
      radial-gradient(720px 380px at 12% 0%, rgba(212,42,32,.11), transparent 60%),
      radial-gradient(720px 380px at 88% 100%, rgba(0,102,204,.11), transparent 60%),
      radial-gradient(500px 300px at 60% 50%, rgba(255,255,255,.35), transparent 70%),
      #dedee5;
  }
  .tile-white{
    background:
      radial-gradient(720px 380px at 88% 0%, rgba(0,102,204,.10), transparent 60%),
      radial-gradient(720px 380px at 12% 100%, rgba(212,42,32,.10), transparent 60%),
      radial-gradient(500px 300px at 40% 50%, rgba(255,255,255,.35), transparent 70%),
      #e6e6ec;
  }
  .item.flash .pill{border-color:var(--blue-focus);box-shadow:0 0 0 2px rgba(0,113,227,.35)}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:#d2d2d7;flex:none;transition:background .3s}
  .item.done .pill .dot{background:var(--pos)}
  .item.part .pill .dot{background:#ff9f0a}

  /* ---------- bảng nhập: sheet trắng ---------- */
  .entry-layer{
    position:fixed;inset:0;z-index:56;display:none;align-items:center;justify-content:center;
    padding:20px;background:rgba(0,0,0,.35);
  }
  .entry-layer.show{display:flex}
  /* chế độ xem nhanh khi lia chuột: không chặn nền, rời chuột là ẩn */
  .entry-layer.preview{background:transparent;pointer-events:none}
  .entry-box{
    width:min(500px,100%);max-height:86vh;overflow:auto;
    border-radius:18px;border:1px solid var(--hairline);
    background:var(--canvas);color:var(--ink);
    box-shadow:var(--shadow-product);
    padding:24px;
    animation:pop .22s cubic-bezier(.3,.8,.3,1);
  }
  @keyframes pop{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .entry-box h5{
    margin:0 0 2px;font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:-.022em;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  .entry-box .meta{font-size:12px;color:var(--ink-48);margin:0 0 16px;letter-spacing:-.12px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field label{display:block;font-size:12px;letter-spacing:-.12px;color:var(--ink-48);margin:0 0 5px;font-weight:600}
  .field input{
    width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--hairline);
    background:var(--parchment);color:var(--ink);font:inherit;font-size:17px;
    font-variant-numeric:tabular-nums;
  }
  .field input:focus{outline:none;border-color:var(--blue-focus);box-shadow:0 0 0 2px rgba(0,113,227,.25);background:#fff}
  .days{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:4px}
  .days .d{display:flex;flex-direction:column;gap:3px}
  .days .d span{font-size:10px;color:var(--ink-48);text-align:center;letter-spacing:-.08px}
  .days .d input{padding:7px 4px;font-size:14px;text-align:center;border-radius:8px;border:1px solid var(--hairline);background:var(--parchment);color:var(--ink)}
  .days .d input:focus{outline:none;border-color:var(--blue-focus);background:#fff}
  .entry-box .live{
    grid-column:1 / -1;margin-top:10px;padding:12px 14px;border-radius:11px;
    background:var(--parchment);font-size:14px;color:var(--muted);letter-spacing:-.224px;
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums;
  }
  .entry-box .live b{color:var(--ink);font-weight:600}

  /* ---------- chênh lệch: tile tối ---------- */
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 auto 24px}
  .chip{
    padding:8px 16px;border-radius:9999px;font-size:14px;font-weight:600;letter-spacing:-.224px;
    border:1px solid rgba(255,255,255,.16);background:var(--tile-dark-2);color:var(--on-dark-muted);
    font-variant-numeric:tabular-nums;
  }
  .chip.ok{color:var(--pos-dark)}
  .chip.bad{color:var(--neg-dark)}
  .chip.wt{color:var(--ink-48)}
  .chip.concl{color:var(--blue-on-dark)}
  .var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}
  .var-card{
    border-radius:18px;border:1px solid rgba(255,255,255,.1);padding:18px 20px;
    background:var(--tile-dark-2);
    display:flex;flex-direction:column;gap:6px;
  }
  .var-card .nm{font-size:14px;font-weight:600;letter-spacing:-.224px;color:var(--on-dark)}
  .var-card .val{
    font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.022em;
    font-variant-numeric:tabular-nums;color:var(--on-dark);
  }
  .var-card .sub{font-size:12px;color:var(--on-dark-muted);letter-spacing:-.12px}
  .var-card.neg .val{color:var(--neg-dark)}
  .var-card.pos .val{color:var(--pos-dark)}
  .var-card.zero .val{color:var(--blue-on-dark)}
  .var-card.wait .val{color:var(--ink-48);font-size:15px;font-weight:400;font-family:var(--font-text)}

  /* ---------- vật tư: hàng dọc, tên trái + các ô nhập bên cạnh ---------- */
  .vt-list{display:flex;flex-direction:column;gap:10px}
  .vt-row{
    display:flex;gap:14px;align-items:stretch;
    border-radius:16px;border:1px solid rgba(255,255,255,.95);
    background:rgba(255,255,255,.58);
    backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
    box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(0,0,0,.1);
    padding:12px 14px;transition:border-color .2s,box-shadow .2s;
  }
  .vt-row:hover{border-color:#b8b8bd;background:rgba(255,255,255,.72)}
  .vt-row.flash{border-color:var(--blue-focus);box-shadow:0 0 0 2px rgba(0,113,227,.35)}
  .vt-name{
    flex:0 0 206px;min-width:150px;display:flex;align-items:flex-start;gap:8px;
    font-size:15px;font-weight:700;color:#000;letter-spacing:-.224px;line-height:1.3;
  }
  .vt-name .dot{width:8px;height:8px;border-radius:50%;background:#d2d2d7;flex:none;margin-top:5px}
  .vt-row.done .vt-name .dot,.mon-row.done .vt-name .dot{background:var(--pos)}
  .vt-row.part .vt-name .dot{background:#ff9f0a}
  .vt-name small{display:block;font-size:11px;font-weight:400;color:var(--ink-48);margin-top:2px}
  .vt-fields{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
  .vt-f{display:flex;flex-direction:column;gap:3px;min-width:0}
  .vt-f label{font-size:10px;color:var(--ink-48);font-weight:600;letter-spacing:-.08px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vt-f.out label{color:var(--blue)}
  .vt-f input{
    width:100%;padding:8px;border-radius:8px;border:1px solid var(--hairline);
    background:rgba(255,255,255,.75);color:var(--ink);font:inherit;font-size:15px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .vt-f input:focus{outline:none;border-color:var(--blue-focus);box-shadow:0 0 0 2px rgba(0,113,227,.25);background:#fff}
  .vt-f .ro{
    padding:8px;border-radius:8px;border:1px dashed rgba(0,0,0,.12);
    background:rgba(0,0,0,.03);font-size:15px;text-align:right;font-variant-numeric:tabular-nums;
    color:var(--ink-80);min-height:35px;display:flex;align-items:center;justify-content:flex-end;
  }
  .vt-f .ro.neg{color:var(--neg);border-color:rgba(227,0,0,.35);background:rgba(227,0,0,.05)}
  .vt-f .ro.pos{color:var(--pos);border-color:rgba(29,157,80,.35);background:rgba(29,157,80,.05)}

  /* ---------- nhập nhanh theo ngày (món bán) ---------- */
  .day-banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:12px 16px;border-radius:14px;margin:0 0 16px;
    border:1px solid rgba(0,102,204,.3);background:rgba(0,102,204,.08);
    font-size:14px;font-weight:600;color:var(--blue);
  }
  .day-banner button{
    border:1px solid rgba(0,102,204,.4);background:#fff;color:var(--blue);
    padding:8px 14px;border-radius:9999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .mon-row{
    display:flex;gap:14px;align-items:center;
    border-radius:14px;border:1px solid rgba(255,255,255,.75);
    background:rgba(255,255,255,.42);
    backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(0,0,0,.07);
    padding:10px 14px;margin-bottom:8px;
  }
  .mon-row.flash{border-color:var(--blue-focus);box-shadow:0 0 0 2px rgba(0,113,227,.35)}
  .mon-row .vt-name{flex:1}
  .mon-row input{
    flex:0 0 120px;width:120px;padding:9px 12px;border-radius:9px;border:1px solid var(--hairline);
    background:rgba(255,255,255,.8);color:var(--ink);font:inherit;font-size:16px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .mon-row input:focus{outline:none;border-color:var(--blue-focus);box-shadow:0 0 0 2px rgba(0,113,227,.25);background:#fff}

  /* ---------- tiêu đề + thanh tìm kiếm cạnh (mục chênh lệch) ---------- */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 auto 20px}
  .sec-head .sec-label{margin:0}
  .sec-search{
    flex:0 1 300px;min-width:180px;height:42px;padding:10px 18px;border-radius:9999px;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--on-dark);
    font:inherit;font-size:15px;
  }

/* =====================================================================
   LÕI CÔNG THỨC — sao chép nguyên văn từ file Excel:
   Tổng bán món (AH, sheet 2)  = SUM(ngày 1..31)
   Xuất định mức vật tư (H)    = SUMIF định mức: Σ(Định lượng chuẩn × Tổng bán món)
                                 (Giò sống cộng thêm mã ATHI0125 — bomAlias)
   Tồn cuối kỳ (K)             = D+E+F−G−H−I−J
                                 = Tồn đầu + Nhập mua + Nhập ĐC − Xuất ĐC
                                   − Xuất định mức − Xuất hủy − Xuất test
   CHÊNH LỆCH (M)              = L − K  (Kiểm kê − Tồn cuối kỳ)
   Thành tiền (O)              = N × M  (Đơn giá × Chênh lệch); tổng = SUM(O)
   ===================================================================== */
var STORE_KEY="ckk05-v2";
var VFIELDS=[
  ["tonDau","Tồn đầu"],
  ["nhapMua","Nhập mua"],
  ["nhapDC","Nhập ĐC"],
  ["xuatDC","Xuất ĐC"],
  ["xuatHuy","Xuất hủy"],
  ["xuatTest","Xuất test"],
  ["kiemKe","Kiểm kê"]
];
var DAYS=31;
var dayFilter=null; /* null = xem tất cả ngày; 0..30 = nhập nhanh 1 ngày */

function load(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if(raw){var d=JSON.parse(raw);if(d&&d.v&&d.m)return d;}
  }catch(e){}
  return {v:{},m:{},gia:{},dl:{}};
}
var state=load();
function ensureState(){
  if(!state.gia)state.gia={};
  if(!state.dl)state.dl={};
  if(!state.custom)state.custom={vatTu:[],monBan:[],bom:[]};
  if(!state.removedVT)state.removedVT=[];
  if(!state.removedMon)state.removedMon=[];
  if(!state.seq)state.seq=1;
  if(state.brandNum===undefined)state.brandNum="";
}
ensureState();
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}

/* Danh mục hiệu lực = danh mục file Excel − mục đã xoá + mục tự thêm */
function allVatTu(){
  return CATALOG.vatTu.filter(function(v){return state.removedVT.indexOf(v.ma)<0;})
    .concat(state.custom.vatTu);
}
function allMonBan(){
  return CATALOG.monBan.filter(function(m){return state.removedMon.indexOf(m.ma)<0;})
    .concat(state.custom.monBan);
}
function allBom(){
  return CATALOG.bom.filter(function(b){
    return state.removedVT.indexOf(b[0])<0&&state.removedMon.indexOf(b[1])<0;
  }).concat(state.custom.bom);
}

function itemV(ma){
  if(!state.v[ma]){
    var o={};VFIELDS.forEach(function(f){o[f[0]]="";});
    state.v[ma]=o;
  }
  return state.v[ma];
}
function itemM(ma){
  if(!state.m[ma]){
    var arr=[];for(var i=0;i<DAYS;i++)arr.push("");
    state.m[ma]={days:arr};
  }
  return state.m[ma];
}
var giaGoc={};
CATALOG.vatTu.forEach(function(v){giaGoc[v.ma]=v.gia;});
function giaGocOf(ma){
  if(giaGoc[ma]!==undefined)return giaGoc[ma];
  var c=state.custom.vatTu.filter(function(v){return v.ma===ma;})[0];
  return c?(parseFloat(c.gia)||0):0;
}
function gia(ma){
  var g=state.gia[ma];
  return (g===undefined||g===null||String(g).trim()==="")?giaGocOf(ma):parseFloat(g)||0;
}
/* Định lượng chuẩn (cột F) — sửa được, có lưu, mặc định lấy từ file */
function dlKey(maVT,maMon){return maVT+"|"+maMon;}
function dlRaw(maVT,maMon,def){
  var g=state.dl[dlKey(maVT,maMon)];
  return (g===undefined||g===null||String(g).trim()==="")?def:g;
}
function dlVal(maVT,maMon,def){
  var g=state.dl[dlKey(maVT,maMon)];
  return (g===undefined||g===null||String(g).trim()==="")?def:(parseFloat(g)||0);
}
function monName(ma){
  var m=allMonBan().filter(function(x){return x.ma===ma;})[0];
  return m?m.ten:ma;
}

function num(v){var n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;}
function fmt(n){
  return (Math.round(n*10000)/10000).toLocaleString("vi-VN",{maximumFractionDigits:4});
}
function fmt2(n){
  return (Math.round(n*100)/100).toLocaleString("vi-VN",{maximumFractionDigits:2});
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* Tổng bán của 1 món = SUM 31 ngày (cột AH sheet 2) */
function tongBan(maMon){
  var m=itemM(maMon),s=0;
  for(var i=0;i<DAYS;i++)s+=num(m.days[i]);
  return s;
}
/* Xuất định mức toàn bộ vật tư = SUMIF bảng định mức (H45:H195) */
function xdmMap(){
  var map={};
  allBom().forEach(function(b){
    map[b[0]]=(map[b[0]]||0)+dlVal(b[0],b[1],b[2])*tongBan(b[1]);
  });
  Object.keys(CATALOG.bomAlias).forEach(function(target){
    CATALOG.bomAlias[target].forEach(function(src){
      map[target]=(map[target]||0)+(map[src]||0);
    });
  });
  return map;
}
function calcV(ma,map){
  var it=itemV(ma);
  var xdm=map[ma]||0;
  var tonCuoi=num(it.tonDau)+num(it.nhapMua)+num(it.nhapDC)
             -num(it.xuatDC)-xdm-num(it.xuatHuy)-num(it.xuatTest);
  var ready=String(it.kiemKe).trim()!=="";
  var filled=VFIELDS.filter(function(f){return String(it[f[0]]).trim()!=="";}).length;
  return {xdm:xdm,tonCuoi:tonCuoi,chenhLech:num(it.kiemKe)-tonCuoi,ready:ready,filled:filled};
}

/* Lia chuột → xem nhanh (rời chuột tự ẩn). Nhấp → mở hẳn bảng nhập. (dùng cho chip món bán) */
function makePill(key,name,openFn){
  var wrap=document.createElement("div");wrap.className="item";wrap.dataset.key=key;
  var pill=document.createElement("button");pill.className="pill";pill.type="button";
  pill.innerHTML='<span class="dot"></span>'+esc(name);
  var t=null;
  pill.addEventListener("mouseenter",function(){
    t=setTimeout(function(){openFn("preview");},200);
  });
  pill.addEventListener("mouseleave",function(){
    clearTimeout(t);
    if(entryMode==="preview")closeEntry();
  });
  pill.addEventListener("click",function(){clearTimeout(t);openFn("pin");});
  wrap.appendChild(pill);
  return wrap;
}

/* Vật tư: mỗi món 1 hàng — tên bên trái, 7 ô nhập + 3 ô tính bên cạnh */
function buildVat(){
  vtGrid.innerHTML="";
  allVatTu().forEach(function(v){
    var it=itemV(v.ma);

    var name=document.createElement("div");name.className="vt-name";
    name.innerHTML='<span class="dot"></span><span>'+esc(v.ten)+'<small>'+esc(v.ma)+' · '+esc(v.dvt)+'</small></span>';
    row.appendChild(name);
    var fields=document.createElement("div");fields.className="vt-fields";
    VFIELDS.forEach(function(f){
      var d=document.createElement("div");d.className="vt-f";
      d.innerHTML='<label>'+f[1]+'</label>';
      var inp=document.createElement("input");
      inp.type="number";inp.step="any";inp.inputMode="decimal";inp.placeholder="0";
      inp.value=it[f[0]];
      inp.addEventListener("input",function(){it[f[0]]=inp.value;save();refreshAll();});
      d.appendChild(inp);fields.appendChild(d);
    });
    [["xdm","Xuất ĐM"],["ton","Tồn cuối"],["cl","Chênh lệch"]].forEach(function(o){
      var d=document.createElement("div");d.className="vt-f out";
      d.innerHTML='<label>'+o[1]+'</label><div class="ro" data-role="'+o[0]+'">—</div>';
      fields.appendChild(d);
    });
    row.appendChild(fields);
    vtGrid.appendChild(row);
  });
  buildAddRow();
}

/* Nút ＋ cuối danh sách: thêm vật tư mới + món bán + định lượng + đơn giá cùng lúc */
function buildAddRow(){
  var plus=document.createElement("button");plus.type="button";plus.className="add-row";
  plus.innerHTML='<span class="plus">＋</span> Thêm vật tư mới';
  var form=document.createElement("div");form.className="add-form";
  var cats=[];
  allMonBan().forEach(function(m){if(cats.indexOf(m.cat)<0)cats.push(m.cat);});
  var opts=cats.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join("")
    +'<option value="__new">＋ Nhóm mới…</option>';
  form.innerHTML=
    '<div class="af-grid">'
    +'<div class="vt-f"><label>Tên vật tư mới</label><input type="text" data-af="ten" placeholder="VD: Bò wagyu BTP"></div>'
    +'<div class="vt-f"><label>ĐVT</label><input type="text" data-af="dvt" value="Kg"></div>'
    +'<div class="vt-f"><label>Đơn giá</label><input type="number" step="any" data-af="gia" placeholder="0"></div>'
    +'<div class="vt-f"><label>Tên món bán (sheet 2)</label><input type="text" data-af="tenMon" placeholder="Để trống = lấy tên vật tư"></div>'
    +'<div class="vt-f"><label>Nhóm hiển thị</label><select data-af="cat">'+opts+'</select></div>'
    +'<div class="vt-f" data-af-wrap="newcat" style="display:none"><label>Tên nhóm mới</label><input type="text" data-af="newcat" placeholder="VD: MÓN MỚI"></div>'
    +'<div class="vt-f"><label>Định lượng chuẩn (1 suất)</label><input type="number" step="any" data-af="dl" placeholder="1"></div>'
    +'</div>'
    +'<div class="af-actions"><button type="button" class="btn-ghost" data-af="cancel">Huỷ</button>'
    +'<button type="button" class="btn-blue" data-af="ok">Thêm (Enter)</button></div>';
  plus.addEventListener("click",function(){
    form.classList.add("show");plus.style.display="none";
    form.querySelector('[data-af="ten"]').focus();
  });
  form.querySelector('[data-af="cat"]').addEventListener("change",function(){
    form.querySelector('[data-af-wrap="newcat"]').style.display=this.value==="__new"?"":"none";
  });
  function doAdd(){
    var get=function(k){var el=form.querySelector('[data-af="'+k+'"]');return el?String(el.value).trim():"";};
    var ten=get("ten");
    if(!ten){alert("Nhập tên vật tư mới trước đã.");form.querySelector('[data-af="ten"]').focus();return;}
    var catSel=get("cat");
    var cat=catSel==="__new"?(get("newcat")||"MÓN MỚI").toUpperCase():catSel;
    var id=state.seq++;
    var maVT="VT-MOI-"+id,maMon="MON-MOI-"+id;
    state.custom.vatTu.push({ma:maVT,ten:ten,dvt:get("dvt")||"Kg",gia:parseFloat(get("gia"))||0});
    state.custom.monBan.push({ma:maMon,ten:get("tenMon")||ten,cat:cat});
    state.custom.bom.push([maVT,maMon,parseFloat(get("dl"))||1]);
    save();render();
    var row=vtGrid.querySelector('.vt-row[data-key="v:'+maVT+'"]');
    if(row){
      row.scrollIntoView({behavior:"smooth",block:"center"});
      row.classList.add("flash");setTimeout(function(){row.classList.remove("flash");},2500);
    }
  }
  form.addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault();doAdd();}
    if(e.key==="Escape"){form.classList.remove("show");plus.style.display="";}
  });
  form.querySelector('[data-af="ok"]').addEventListener("click",doAdd);
  form.querySelector('[data-af="cancel"]').addEventListener("click",function(){
    form.classList.remove("show");plus.style.display="";
  });
  vtGrid.appendChild(plus);vtGrid.appendChild(form);
}

/* Món bán: mặc định chip (bấm mở 31 ngày); nhập nhanh theo ngày = mỗi món 1 ô */
function buildMon(){
  monWrap.innerHTML="";
  if(dayFilter!==null){
    var banner=document.createElement("div");banner.className="day-banner";
    banner.innerHTML='<span>Đang nhập nhanh — <b>Ngày '+(dayFilter+1)+'</b>. Nhập số bán từng món cho ngày này.</span>';
    var b=document.createElement("button");b.type="button";b.textContent="Xem tất cả các ngày";
    b.addEventListener("click",function(){setDayFilter(null);});
    banner.appendChild(b);monWrap.appendChild(banner);
  }
  var cats={};
  allMonBan().forEach(function(m){
    if(!cats[m.cat]){
      var lb=document.createElement("div");lb.className="cat-label";lb.textContent=m.cat;monWrap.appendChild(lb);
      cats[m.cat]=document.createElement("div");
      if(dayFilter===null)cats[m.cat].className="pill-grid";
      monWrap.appendChild(cats[m.cat]);
    }
    if(dayFilter===null){
      cats[m.cat].appendChild(makePill("m:"+m.ma,m.ten,function(mode){openEntryM(m.ma,mode);}));
    }else{
      var it=itemM(m.ma);
      var row=document.createElement("div");row.className="mon-row item";row.dataset.key="m:"+m.ma;
      row.innerHTML='<div class="vt-name"><span class="dot"></span><span>'+esc(m.ten)+'<small>'+esc(m.ma)+'</small></span></div>';
      var inp=document.createElement("input");
      inp.type="number";inp.step="any";inp.inputMode="decimal";inp.placeholder="Ngày "+(dayFilter+1);
      inp.value=it.days[dayFilter];
      inp.addEventListener("input",function(){it.days[dayFilter]=inp.value;save();refreshAll();});
      row.appendChild(inp);cats[m.cat].appendChild(row);
    }
  });
}

/* ---------- bảng nhập riêng biệt ---------- */
var entryLayer=document.getElementById("entryLayer");
var entryBody=document.getElementById("entryBody");
var entryKey=null;
var entryMode=null; /* "preview" = xem nhanh khi lia chuột, "pin" = mở hẳn khi nhấp */
function closeEntry(){entryLayer.classList.remove("show","preview");entryKey=null;entryMode=null;}
document.getElementById("entryClose").addEventListener("click",closeEntry);
entryLayer.addEventListener("click",function(e){if(e.target===entryLayer)closeEntry();});

function openEntryM(ma,mode){
  mode=mode||"pin";
  if(entryMode==="pin"&&mode==="preview")return;
  var cat=allMonBan().filter(function(m){return m.ma===ma;})[0];
  if(!cat)return;
  var it=itemM(ma);
  entryKey="m:"+ma;entryMode=mode;

  entryBody.innerHTML="";
  var h=document.createElement("h5");h.textContent=cat.ten;
  var meta=document.createElement("div");meta.className="meta";
  meta.textContent=cat.ma+" · "+cat.cat+" · nhập số lượng bán từng ngày";
  entryBody.appendChild(h);entryBody.appendChild(meta);
  var grid=document.createElement("div");grid.className="fields";

      di.value=it.days[d3];
      di.addEventListener("input",function(){it.days[d3]=di.value;save();refreshAll();});
      cell.appendChild(di);days.appendChild(cell);
    })(d2);

/* ---------- tính lại toàn bộ ---------- */
function refreshAll(){
  var map=xdmMap();
  var duong=0,am=0,khop=0,cho=0,totalO=0;
  allVatTu().forEach(function(v){
    var r=calcV(v.ma,map);
    var row=vtGrid.querySelector('.vt-row[data-key="v:'+v.ma+'"]');
    if(row){
      row.classList.toggle("done",r.filled===VFIELDS.length);
      row.classList.toggle("part",r.filled>0&&r.filled<VFIELDS.length);
      var ex=row.querySelector('[data-role="xdm"]');if(ex)ex.textContent=fmt(r.xdm);
      var tn=row.querySelector('[data-role="ton"]');if(tn)tn.textContent=fmt(r.tonCuoi);
      var clr=row.querySelector('[data-role="cl"]');
      if(clr){
        clr.classList.remove("pos","neg");
        if(!r.ready)clr.textContent="—";
        else if(r.chenhLech<0){clr.classList.add("neg");clr.textContent="-"+fmt(Math.abs(r.chenhLech));}
        else if(r.chenhLech>0){clr.classList.add("pos");clr.textContent="+"+fmt(r.chenhLech);}
        else clr.textContent="0";
      }
    }
    var card=varGrid.querySelector('.var-card[data-ma="'+v.ma+'"]');
    if(card){
      var val=card.querySelector(".val"),sub=card.querySelector(".sub");
      card.classList.remove("neg","pos","zero","wait");
      if(!r.ready){card.classList.add("wait");val.textContent="Chưa đủ số liệu";sub.textContent="Nhập kiểm kê để tính chênh lệch";}
      else if(r.chenhLech<0){card.classList.add("neg");val.textContent="-"+fmt(Math.abs(r.chenhLech));sub.textContent=v.dvt+" · tồn cuối kỳ "+fmt(r.tonCuoi);}
      else if(r.chenhLech>0){card.classList.add("pos");val.textContent="+"+fmt(r.chenhLech);sub.textContent=v.dvt+" · tồn cuối kỳ "+fmt(r.tonCuoi);}
      else{card.classList.add("zero");val.textContent="0";sub.textContent="Khớp số ✔";}
    }
    if(!r.ready)cho++;
    else if(r.chenhLech>0)duong++;
    else if(r.chenhLech<0)am++;
    else khop++;
    totalO+=gia(v.ma)*(r.ready?r.chenhLech:0); /* O = N × M; ô trống tính 0 như Excel */
  });
  /* Tổng thành tiền = SUM(O6:O40) — hiện nổi bật dưới logo */
  var amtEl=document.getElementById("heroTotalAmt");
  amtEl.textContent=fmt2(totalO);
  amtEl.classList.remove("pos","neg");
  if(totalO>0)amtEl.classList.add("pos");
  else if(totalO<0)amtEl.classList.add("neg");
  allMonBan().forEach(function(m){
    var wrap=monWrap.querySelector('.item[data-key="m:'+m.ma+'"]');
    if(wrap){
      var has=tongBan(m.ma)>0;
      wrap.classList.toggle("done",has);
      wrap.classList.remove("part");
    }
  });
  /* Tổng quan xu hướng chênh lệch — như khối U1:W4 của file */
  summary.innerHTML=
    '<span class="chip ok">Mặt hàng dương: '+duong+'</span>'
    +'<span class="chip bad">Mặt hàng âm: '+am+'</span>'
    +'<span class="chip">Khớp số: '+khop+'</span>'
    +'<span class="chip wt">Chưa đủ số liệu: '+cho+'</span>'
    +((duong+am)>0?'<span class="chip concl">Kết luận: '+(duong>=am?"TĂNG TRƯỞNG":"THẤT THOÁT")+'</span>':'');
  /* dòng tính trực tiếp trong bảng nhập đang mở */
  if(entryKey){
    var live=entryBody.querySelector(".live");
    if(live){
      if(entryKey.indexOf("v:")===0){
        var r2=calcV(entryKey.slice(2),map);
        live.innerHTML="Xuất định mức: <b>"+fmt(r2.xdm)+"</b>"
          +"<span>Tồn cuối kỳ: <b>"+fmt(r2.tonCuoi)+"</b></span>"
          +"<span>Chênh lệch: <b>"+(r2.ready?fmt(r2.chenhLech):"—")+"</b></span>";
      }else{
        live.innerHTML="Tổng cộng (cột AH): <b>"+fmt(tongBan(entryKey.slice(2)))+"</b>";
      }
    }
  }
}

function renderDelList(){

  allVatTu().forEach(function(v){
    var row=document.createElement("div");row.className="price-row";
    row.innerHTML='<span class="nm">'+esc(v.ten)+'<small>'+esc(v.ma)+' · '+esc(v.dvt)+'</small></span>';
    var b=document.createElement("button");b.type="button";b.className="del-btn";b.textContent="Xoá";
    b.addEventListener("click",function(){deleteVat(v.ma,v.ten);});
    row.appendChild(b);

function deleteVat(ma,ten){
  /* món bán chỉ thuộc riêng vật tư này (mọi liên kết định mức đều trỏ về nó) sẽ bị xoá kèm */
  var byMon={};
  allBom().forEach(function(b){(byMon[b[1]]=byMon[b[1]]||[]).push(b[0]);});
  var linkedMons=[];
  Object.keys(byMon).forEach(function(mon){
    var vts=byMon[mon];
    var onlyThis=vts.indexOf(ma)>=0&&vts.every(function(x){return x===ma;});
    if(onlyThis)linkedMons.push(mon);
  });
  var msg='Xoá vật tư "'+ten+'"?\n\nSẽ xoá kèm: đơn giá, định lượng chuẩn và số liệu đã nhập của món này'
    +(linkedMons.length?('\n+ '+linkedMons.length+' món bán chỉ thuộc vật tư này: '+linkedMons.map(monName).join(", ")):'')
    +'\n\nKhông thể hoàn tác (nên Sao lưu số liệu trước).';
  if(!confirm(msg))return;
  var idx=-1;
  state.custom.vatTu.forEach(function(v,i){if(v.ma===ma)idx=i;});
  if(idx>=0)state.custom.vatTu.splice(idx,1);
  else state.removedVT.push(ma);
  state.custom.bom=state.custom.bom.filter(function(b){return b[0]!==ma;});
  linkedMons.forEach(function(mon){
    var mi=-1;
    state.custom.monBan.forEach(function(m,i){if(m.ma===mon)mi=i;});
    if(mi>=0)state.custom.monBan.splice(mi,1);
    else state.removedMon.push(mon);
    state.custom.bom=state.custom.bom.filter(function(b){return b[1]!==mon;});
    delete state.m[mon];
  });
  delete state.v[ma];
  delete state.gia[ma];
  Object.keys(state.dl).forEach(function(k){if(k.indexOf(ma+"|")===0)delete state.dl[k];});
  save();render();renderDelList();
}
function renderPriceList(){
  var list=document.getElementById("priceList");list.innerHTML="";
  allVatTu().forEach(function(v){
    var row=document.createElement("div");row.className="price-row";
    row.innerHTML='<span class="nm">'+esc(v.ten)+'<small>'+esc(v.ma)+' · '+esc(v.dvt)+'</small></span>';
    var inp=document.createElement("input");
    inp.type="number";inp.step="any";
    inp.value=(state.gia[v.ma]!==undefined&&state.gia[v.ma]!==null&&String(state.gia[v.ma]).trim()!=="")?state.gia[v.ma]:giaGocOf(v.ma);
    inp.addEventListener("input",function(){state.gia[v.ma]=inp.value;save();refreshAll();});
    row.appendChild(inp);
    list.appendChild(row);
  });
}

/* ---------- EXPORT-EXCEL-BEGIN: xuất .xlsx đúng cấu trúc file gốc ---------- */
function colL(n){var s="";while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26;}return s;}
function cellS(ws,a,v){ws[a]={t:"s",v:String(v)};}
function cellN(ws,a,v){ws[a]={t:"n",v:v};}
function cellF(ws,a,f){ws[a]={t:"n",f:f};}
function cellFS(ws,a,f){ws[a]={t:"s",f:f};}
function putNum(ws,a,raw){if(String(raw==null?"":raw).trim()!=="")cellN(ws,a,num(raw));}
function buildWorkbookSheets(){
  var vt=allVatTu(),mons=allMonBan(),bom=allBom();
  /* ----- sheet 2: SL ban theo ngay ----- */
  var ws2={};
  cellS(ws2,"A1","BANG NHAP SO LUONG MON BAN THEO NGAY - CKK"+(state.brandNum||""));
  cellS(ws2,"A3","Ghi chú: nhập số lượng bán từng ngày. Cột Tổng cộng tự cộng dồn 31 ngày và liên kết sang sheet chênh lệch.");
  var hd2=["Mã món bán","Tên món bán"];
  for(var d=1;d<=31;d++)hd2.push("Ngày "+d);
  hd2.push("Tổng cộng");
  for(var c=0;c<hd2.length;c++)cellS(ws2,colL(c+1)+"5",hd2[c]);
  var row=6,catSeen=null;
  mons.forEach(function(m){
    if(m.cat!==catSeen){catSeen=m.cat;cellS(ws2,"A"+row,m.cat);row++;}
    cellS(ws2,"A"+row,m.ma);cellS(ws2,"B"+row,m.ten);
    var it=itemM(m.ma);
    for(var d2=0;d2<31;d2++)putNum(ws2,colL(3+d2)+row,it.days[d2]);
    cellF(ws2,"AH"+row,"SUM(C"+row+":AG"+row+")");
    row++;
  });
  var last2=row-1;
  ws2["!ref"]="A1:AH"+last2;
  ws2["!cols"]=[{wch:12},{wch:36}];
  /* ----- sheet 1: bảng chênh lệch ----- */
  var ws1={};
  cellS(ws1,"A1","BANG TINH CHENH LECH SU DUNG NGUYEN LIEU - CKK"+(state.brandNum||""));
  cellS(ws1,"A3","Ghi chú: cột D,E,F,G,I,J,L,N nhập tay. Cột H,K,M,O là công thức tự động.");
  var hd1=["Mã vật tư","Tên vật tư","ĐVT vật tư","Tồn đầu kỳ","Nhập mua","Nhập điều chuyển","Xuất điều chuyển","Xuất định mức","Xuất hủy","Xuất test","Tồn cuối kỳ","Kiểm kê","Chênh lệch","ĐƠN GIÁ","THÀNH TIỀN"];
  for(var c1=0;c1<hd1.length;c1++)cellS(ws1,colL(c1+1)+"5",hd1[c1]);
  var nv=vt.length,tr=6+nv;
  var bh=tr+3,bs=bh+1,be=bs+bom.length-1;
  vt.forEach(function(v,i){
    var r=6+i,it=itemV(v.ma);
    cellS(ws1,"A"+r,v.ma);cellS(ws1,"B"+r,v.ten);cellS(ws1,"C"+r,v.dvt);
    putNum(ws1,"D"+r,it.tonDau);putNum(ws1,"E"+r,it.nhapMua);putNum(ws1,"F"+r,it.nhapDC);
    putNum(ws1,"G"+r,it.xuatDC);
    var hf="SUMIF($A$"+bs+":$A$"+be+",A"+r+",$H$"+bs+":$H$"+be+")";
    (CATALOG.bomAlias[v.ma]||[]).forEach(function(src){
      hf+='+SUMIF($A$'+bs+':$A$'+be+',"'+src+'",$H$'+bs+':$H$'+be+')';
    });
    cellF(ws1,"H"+r,hf);
    putNum(ws1,"I"+r,it.xuatHuy);putNum(ws1,"J"+r,it.xuatTest);
    cellF(ws1,"K"+r,"D"+r+"+E"+r+"+F"+r+"-G"+r+"-H"+r+"-I"+r+"-J"+r);
    putNum(ws1,"L"+r,it.kiemKe);
    cellF(ws1,"M"+r,"L"+r+"-K"+r);
    cellN(ws1,"N"+r,gia(v.ma));
    cellF(ws1,"O"+r,"N"+r+"*M"+r);
  });
  cellS(ws1,"N"+tr,"TỔNG:");
  cellF(ws1,"O"+tr,"SUM(O6:O"+(tr-1)+")");
  cellS(ws1,"Q2","Số mặt hàng dương:");cellF(ws1,"S2",'COUNTIF($M$6:$M$'+(tr-1)+',">0")');
  cellS(ws1,"Q3","Số mặt hàng âm:");cellF(ws1,"S3",'COUNTIF($M$6:$M$'+(tr-1)+',"<0")');
  cellS(ws1,"Q4","Kết luận:");cellFS(ws1,"S4",'IF(S2>=S3,"TANG TRUONG","THAT THOAT")');
  ["Mã vật tư","Tên vật tư","ĐVT vật tư","Mã món bán","Tên món bán","Định lượng chuẩn","SL bán","Tổng định lượng chuẩn"]
    .forEach(function(h,i){cellS(ws1,colL(i+1)+bh,h);});
  var vtInfo={};vt.forEach(function(v){vtInfo[v.ma]=v;});
  bom.forEach(function(b,i){
    var r=bs+i,vi=vtInfo[b[0]];
    cellS(ws1,"A"+r,b[0]);cellS(ws1,"B"+r,vi?vi.ten:b[0]);cellS(ws1,"C"+r,vi?vi.dvt:"");
    cellS(ws1,"D"+r,b[1]);cellS(ws1,"E"+r,monName(b[1]));
    cellN(ws1,"F"+r,dlVal(b[0],b[1],b[2]));
    cellF(ws1,"G"+r,"IFERROR(VLOOKUP(D"+r+",'SL ban theo ngay'!$A$6:$AH$"+last2+",34,FALSE()),0)");
    cellF(ws1,"H"+r,"F"+r+"*G"+r);
  });
  ws1["!ref"]="A1:S"+be;
  ws1["!cols"]=[{wch:11},{wch:38},{wch:10},{wch:11},{wch:10},{wch:15},{wch:15},{wch:13},{wch:9},{wch:9},{wch:11},{wch:9},{wch:11},{wch:9},{wch:12}];
  return {ws1:ws1,ws2:ws2};
}
/* EXPORT-EXCEL-END */
function ensureXLSX(cb,fail){
  if(window.XLSX)return cb();
  var sc=document.createElement("script");
  sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  sc.onload=function(){cb();};
  sc.onerror=function(){fail();};
  document.head.appendChild(sc);
}
function exportExcel(){
  ensureXLSX(function(){
    try{
      var sh=buildWorkbookSheets();
      var wb=XLSX.utils.book_new();
      var s1name="CKK"+(state.brandNum||"");
      XLSX.utils.book_append_sheet(wb,sh.ws1,s1name);
      XLSX.utils.book_append_sheet(wb,sh.ws2,"SL ban theo ngay");
      var d=new Date();
      XLSX.writeFile(wb,s1name+"-XNT-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".xlsx");
    }catch(e){alert("Lỗi xuất Excel: "+e.message);}
  },function(){
    alert("Không tải được thư viện Excel (cần có mạng lần đầu). Sẽ tải bản .json thay thế.");
    exportJson();
  });
}
var importFile=document.getElementById("importFile");
document.getElementById("btnImport").addEventListener("click",function(){importFile.click();});
importFile.addEventListener("change",function(){
  var f=importFile.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||typeof d.v!=="object"||typeof d.m!=="object")throw new Error();
      if(confirm("Khôi phục số liệu từ file sao lưu? Số liệu hiện tại sẽ bị thay thế.")){
        state=d;ensureState();save();render();
        alert("Đã khôi phục xong.");
      }
    }catch(e){alert("File sao lưu không hợp lệ.");}
    importFile.value="";
  };
  rd.readAsText(f);
});
document.getElementById("btnReset").addEventListener("click",function(){
  if(confirm("Xoá toàn bộ số liệu đã nhập để bắt đầu kỳ mới?\nĐơn giá, định lượng và các vật tư tự thêm/đã xoá vẫn được giữ.\nNên bấm 'Sao lưu số liệu' trước khi xoá.")){
    state={v:{},m:{},gia:state.gia,dl:state.dl,custom:state.custom,
      removedVT:state.removedVT,removedMon:state.removedMon,seq:state.seq};
    dayFilter=null;save();render();
    menu.classList.remove("open");burger.classList.remove("open");
  }
});

/* ---------- hiệu ứng cuộn: mờ dần + thu nhẹ ----------
   Tính theo số pixel đang hiện trong màn hình (không dùng tỷ lệ toàn khối,
   vì khối cao hơn màn hình sẽ không bao giờ đạt tỷ lệ và bị mờ vĩnh viễn). */
var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!reduced&&"IntersectionObserver" in window){
  var ths=[];for(var ti=0;ti<=50;ti++)ths.push(ti/50);
  var io=new IntersectionObserver(function(entries){
    var vh=window.innerHeight||document.documentElement.clientHeight;
    entries.forEach(function(en){
      var r=en.boundingClientRect;
      var visible=Math.min(r.bottom,vh)-Math.max(r.top,0);
      var need=Math.min(vh*0.22,r.height*0.3);
      en.target.classList.toggle("dim",visible<need);
    });
  },{threshold:ths});
  document.querySelectorAll(".fx").forEach(function(el){io.observe(el);});
}

/* Số chi nhánh cạnh chữ CKK (tối đa 2 chữ số) — lưu theo từng bảng */
function applyBrandNum(){
  var el=document.getElementById("brandNum");
  if(el)el.textContent=state.brandNum||"";
  document.title="Chang Kang Kung CKK"+(state.brandNum||"")+" — Xuất Nhập Tồn";
}
document.getElementById("brandEdit").addEventListener("click",function(){
  var cur=state.brandNum||"";
  var v=prompt("Nhập số chi nhánh gắn cạnh CKK (tối đa 2 chữ số, để trống để bỏ số):",cur);
  if(v===null)return;
  v=v.trim();
  if(!/^\d{0,2}$/.test(v)){alert("Chỉ nhập tối đa 2 chữ số (VD: 05, 21, 12) hoặc để trống.");return;}
  state.brandNum=v;save();applyBrandNum();
});
applyBrandNum();

render();
})();
</script>
